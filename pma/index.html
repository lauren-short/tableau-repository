<style>
  :root{--navy:#002855;--ink:#1c2733;--mut:#667085;--line:#e3e8ef;--bg:#f2f5f9;--card:#fff;--ok:#0f7b4a;--okbg:#e6f6ee;--warn:#9a5b00;--warnbg:#fff4de;--bad:#b42318;--badbg:#fee4e2;--accent:#0a4fb4}
  *{box-sizing:border-box} [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:Gotham,"Gotham Book",Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
  #app{display:flex;flex-direction:column;height:100%}
  #stage{flex:1;min-height:0}
  #stage svg{width:100%;height:100%;display:block}
  /* app chrome only appears outside Tableau */
  body:not(.standalone) .chrome{display:none}
  body.standalone{background:var(--bg)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{height:40px;width:auto;display:block}
  .brand .t{font-weight:700;font-size:16px;letter-spacing:.2px;color:var(--navy)} .brand .s{font-size:12px;color:var(--mut);margin-top:1px}
  .actions{display:flex;align-items:center;gap:10px}
  .btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);font:600 13px/1 inherit;font-family:inherit;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){border-color:#c3ccd8;background:#f7f9fc}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;padding:0 22px}
  .btn.primary:hover:not(:disabled){background:#003a7a;border-color:#003a7a}
  .btn.ghost{border-color:var(--navy);color:var(--navy)} .btn.ghost:hover:not(:disabled){background:#eef3fb}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
  .seg .btn{border:0;border-radius:0;border-right:1px solid var(--line);height:34px;padding:0 13px} .seg .btn:last-child{border-right:0}
  .controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}
  .filebtn{display:inline-flex;align-items:center;gap:9px;max-width:360px;height:36px;padding:0 14px;border:1px dashed #b6c2d2;border-radius:9px;background:#f8fafd;cursor:pointer;font-size:13px;color:var(--ink)}
  .filebtn:hover{border-color:var(--navy);background:#f0f5fc} .filebtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .field{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
  select{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font:13px inherit;font-family:inherit;color:var(--ink);max-width:300px}
  .chips{display:inline-flex;gap:8px}
  .chip{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:600}
  .chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)}
  .opt{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut);cursor:pointer;margin-left:auto}
  .opt input{accent-color:var(--navy);width:15px;height:15px}
  .meta{padding:8px 24px 0;font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;gap:3px;background:var(--bg)}
  .meta:empty{display:none} .meta .adj{color:var(--warn)}
  details.more{padding:10px 24px;background:#fff;border-bottom:1px solid var(--line)}
  details.more summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:600}
  details.more textarea{width:100%;height:60px;margin:0;padding:8px;border:1px solid var(--line);border-radius:9px;font:12px/1.4 Consolas,Menlo,monospace}
  #msg{display:none;margin:12px 24px 0;padding:10px 14px;border-radius:9px;background:var(--badbg);color:var(--bad);font-size:13px;font-weight:500}
  body:not(.standalone) #msg{margin:0;padding:6px 12px;border-radius:0;background:none;color:#b00020}
  /* canvas */
  #stage.stand{padding:22px 24px 30px;overflow:auto;display:flex;justify-content:center;align-items:flex-start}
  .card{width:100%;max-width:min(1400px,calc((100vh - 230px) * 1.78));min-width:640px;aspect-ratio:1508/847;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 10px 30px rgba(16,24,40,.08)}
  .card svg{width:100%;height:100%;display:block;border-radius:14px}
  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:min(720px,100%);height:min(380px,60vh);margin-top:4vh;text-align:center;border:2px dashed #b6c2d2;border-radius:18px;background:#fff;cursor:pointer;transition:.15s;color:var(--ink)}
  .drop:hover,body.dragging .drop{border-color:var(--navy);background:#f3f7fd}
  .drop .ic{width:60px;height:60px;border-radius:16px;background:#eaf0fa;display:grid;place-items:center;margin-bottom:6px}
  .drop h2{margin:0;font-size:20px;color:var(--navy)} .drop p{margin:0;font-size:14px;color:var(--mut);max-width:420px;line-height:1.5} .drop u{color:var(--accent)}
  .btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.on:hover:not(:disabled){background:#003a7a;border-color:#003a7a}
  input.txt,input.num{height:34px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font:13px inherit;font-family:inherit;color:var(--ink);background:#fff;width:120px}
  input.num{width:64px}
  .compare{background:#f8fafd;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
  .morebody{display:flex;flex-direction:column;gap:14px;margin-top:12px} .morebody .crow{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
  .badge{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;background:#eaf0fa;color:var(--navy);font-size:11px;font-weight:700}
  .compare .crow{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
  .ctitle{font-weight:700;font-size:13px;color:var(--navy);min-width:150px}
  .seg .btn.on{background:var(--navy);color:#fff}
  .chip.tog{border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer;font-family:inherit;transition:.15s}
  .chip.tog.on{background:#eaf0fa;color:var(--navy);border-color:#c9d6ea}
  .chip .dot,#picker .dot{width:9px;height:9px;border-radius:50%;margin-right:6px;display:inline-block;flex:none}
  .hint{font-size:12.5px;color:var(--mut)}
  #stage .hdrhit{fill:transparent;cursor:text} #stage .hdrhit:hover{fill:rgba(255,255,255,.18)}
  #picker{border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:240px;overflow:auto;background:#fff}
  #picker .ptools{display:flex;align-items:center;gap:10px;margin-bottom:8px;position:sticky;top:-10px;background:#fff;padding:4px 0}
  #picker .ptools .btn{height:30px;font-size:12px}
  #picker .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:2px 16px}
  #picker label{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 5px;border-radius:6px;cursor:pointer}
  #picker label:hover{background:#eef3fb} #picker label[hidden]{display:none}
  #picker .m{color:var(--mut);margin-left:auto;white-space:nowrap;padding-left:8px;font-size:12px}
  @media print{
    @page{size:1508px 847px;margin:0}
    html,body{width:1508px;height:847px;overflow:hidden;background:#fff}
    .chrome,#msg{display:none!important}
    #app,#stage,#stage.stand{height:847px;padding:0;background:#fff;display:block;overflow:hidden}
    .card{width:1508px;max-width:none;min-width:0;height:847px;border-radius:0;box-shadow:none}
    .card svg{width:1508px;height:847px;border-radius:0}
  }
</style>
</head>

<script>
/* ======================= CONFIG (edit here) ======================= */
const CONFIG = {
  TOP_MAX: 300,        // index value at the very top of the "150+" band (300 = literal 0-300 scale; ~210 spreads the top band like the hand-built slide)
  ROUND_INDEX: true,   // band + position use the whole-number index, same as the slide labels
  GAP: 2,              // min px gap between bubbles when auto-placing
  TITLE: "BRAND PREFERENCE INDEX",
  SUBTITLE: "PERSONICX NS"
};

/* ======================= LOGIC ======================= */
const rnd = v => CONFIG.ROUND_INDEX ? Math.round(v) : v;
function bandOf(idx){ const i=rnd(idx); return i>=150?5:i>=120?4:i>=80?3:i>=50?2:1; }
function displayY(idx){            // 0..500, five equal 100-unit bands
  const i=rnd(idx), T=CONFIG.TOP_MAX;
  if(i>=150) return 400+(Math.min(i,T)-150)/(T-150)*100;
  if(i>=120) return 300+(i-120)/30*100;
  if(i>=80)  return 200+(i-80)/40*100;
  if(i>=50)  return 100+(i-50)/30*100;
  return Math.max(i,0)/50*100;
}
const yPx = d => YB - d/500*PLOT_H;

// Collision-free x: start at each segment's default x, nudge only bubbles that would overlap
function placeX(items){
  const n=items.length, sh=items.map(o=>o.shapes||[{y:o.dy/500*PLOT_H,r:o.r}]), r=items.map(o=>o.r);
  const x0=items.map(o=>o.x0/100*PLOT_W), x=x0.slice();
  const lo=r.map(v=>v+1), hi=r.map(v=>PLOT_W-v-1);
  const LAMBDA=0.004;
  const pen=(i,cx,j)=>{ let c=0; for(const a of sh[i]) for(const b of sh[j]){ const o=a.r+b.r+CONFIG.GAP-Math.hypot(cx-x[j],a.y-b.y); if(o>0)c+=o*o; } return c; };
  for(let pass=0;pass<40;pass++){
    let moved=false;
    const crowd=x.map((xi,i)=>{ let c=0; for(let j=0;j<n;j++) if(j!==i) c+=pen(i,xi,j); return c; });
    const order=[...Array(n).keys()].sort((a,b)=>crowd[b]-crowd[a]);
    for(const i of order){
      if(crowd[i]===0 && Math.abs(x[i]-x0[i])<1e-9) continue;
      let best=x[i], bc=Infinity;
      for(let c=Math.ceil(lo[i]); c<=Math.floor(hi[i]); c++){
        let cost=LAMBDA*(c-x0[i])*(c-x0[i]); for(let j=0;j<n;j++) if(j!==i) cost+=pen(i,c,j);
        if(cost<bc){bc=cost;best=c;}
      }
      if(Math.abs(best-x[i])>1e-9){x[i]=best;moved=true;}
    }
    if(!moved)break;
  }
  return x.map(v=>X0+v);
}

// rows: [{seg, cust, mkt, idx}]  (cust/mkt may be counts or percents; idx optional override)
function prepare(rows){
  const by=new Map();
  for(const r of rows){
    const seg=parseInt(String(r.seg).replace(/[^0-9]/g,''),10);
    if(!(seg in MASTER)) continue;
    const o=by.get(seg)||{seg,cust:null,mkt:null,idx:null,name:null};
    if(r.name) o.name=String(r.name).trim();
    if(isFinite(r.cust)&&r.cust!==null) o.cust=(o.cust||0)+Number(r.cust);
    if(isFinite(r.mkt)&&r.mkt!==null)   o.mkt =(o.mkt ||0)+Number(r.mkt);
    if(isFinite(r.idx)&&r.idx!==null)   o.idx = Number(r.idx);
    by.set(seg,o);
  }
  const list=[...by.values()];
  const sc=list.reduce((a,o)=>a+(o.cust||0),0), sm=list.reduce((a,o)=>a+(o.mkt||0),0);
  const haveShare = sc>0 && sm>0;
  for(const o of list){
    o.cp = haveShare && o.cust!=null ? o.cust/sc : null;
    o.mp = haveShare && o.mkt !=null ? o.mkt /sm : null;
    if(o.idx==null && o.cp!=null && o.mp>0) o.idx=o.cp/o.mp*100;
  }
  return {items:list.filter(o=>o.idx!=null && isFinite(o.idx)), haveShare, skipped:list.filter(o=>o.idx==null).length};
}

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${o.size||14}" font-weight="${o.bold?700:400}" fill="${o.fill||'#222'}" text-anchor="${o.anchor||'start'}" dominant-baseline="${o.base||'central'}"${o.rot?` transform="rotate(${o.rot} ${x} ${y})"`:''}>${esc(s)}</text>`;
const pct=v=>(v*100).toFixed(2)+"%";
const BAND_NAME={5:"Extremely Brand Receptive",4:"Brand Receptive",3:"Brand Neutral",2:"Brand Resistant",1:"Extremely Brand Resistant"};
// Largest-remainder rounding to 0.01%: every band is rounded down, then the leftover hundredths go to the
// bands with the biggest remainders, so the five displayed numbers add to exactly the true total (100.00%).
function apportion(raw,target){
  const fl=raw.map(Math.floor); let rem=target-fl.reduce((a,b)=>a+b,0);
  raw.map((v,i)=>[v-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{ if(rem>0){fl[i]++;rem--;} });
  return fl;
}

/* ======================= COMPARE (year over year) ======================= */
const UPC="#5CD62E", DNC="#F0200F", UPT="#2FA81F", DNT="#E3341F", LIFE_ORDER=["Y","C","E","R"], CMP_DX=321, CMP_DY=-11;
const fmtPct=p=>p==null?"n/a":(p>0?"+":"")+p+"%";
function compareData(curRows,prevRows){
  const A=prepare(curRows), B=prepare(prevRows), pm=new Map(B.items.map(o=>[o.seg,o])), out=[]; let unmatched=0;
  for(const c of A.items){
    const p=pm.get(c.seg); if(!p){unmatched++;continue;}
    const m=MASTER[c.seg], ci=Math.round(c.idx), pi=Math.round(p.idx);
    out.push({seg:c.seg,name:(c.name||p.name||m[3]),life:m[0],aff:m[1],x0:m[2],r:RADIUS[m[1]],
      pIdx:p.idx,cIdx:c.idx,pR:pi,cR:ci,delta:ci-pi,pct:pi>0?Math.round((ci-pi)/pi*100)||0:null,
      pBand:bandOf(p.idx),cBand:bandOf(c.idx),cp:c.cp,mp:c.mp,pcp:p.cp,pmp:p.mp});
  }
  return {rows:out,unmatched};
}
function selectRows(all,o){
  let r=all.slice();
  if(o.view==="move") r=r.filter(x=>x.delta===0||(x.delta>0&&o.dirs.up)||(x.delta<0&&o.dirs.down));
  if(o.view==="life") r=r.filter(x=>o.lifes.has(x.life));
  if(o.preset==="changed") r=r.filter(x=>x.pBand!==x.cBand);
  else if(o.preset==="up") r=r.filter(x=>x.delta>0);
  else if(o.preset==="down") r=r.filter(x=>x.delta<0);
  else if(o.preset==="custom") r=r.filter(x=>o.custom.has(x.seg));
  r.sort(o.preset==="up"?(a,b)=>b.delta-a.delta:o.preset==="down"?(a,b)=>a.delta-b.delta:(a,b)=>(Math.abs(b.delta)-Math.abs(a.delta))||(a.seg-b.seg));
  const total=r.length; return {rows:r.slice(0,o.max).sort((a,b)=>a.seg-b.seg),total};
}
// index of a whole lifestage = (sum of customer share) / (sum of market share) x 100 (falls back to the average index if shares are missing)
function lifeRollup(all,lifes){
  const out=[];
  for(const k of LIFE_ORDER){
    if(!lifes.has(k)) continue; const g=all.filter(x=>x.life===k); if(!g.length) continue;
    const share=g.every(x=>x.cp!=null&&x.mp!=null&&x.pcp!=null&&x.pmp!=null);
    let pv,cv;
    if(share){ const sm=(f)=>g.reduce((a,x)=>a+(x[f]||0),0); pv=sm("pmp")>0?sm("pcp")/sm("pmp")*100:null; cv=sm("mp")>0?sm("cp")/sm("mp")*100:null; }
    else { pv=g.reduce((a,x)=>a+x.pIdx,0)/g.length; cv=g.reduce((a,x)=>a+x.cIdx,0)/g.length; }
    if(pv==null||cv==null) continue;
    const p=Math.round(pv), c=Math.round(cv);
    out.push({k,label:LIFE[k],n:g.length,p,c,pct:p>0?Math.round((c-p)/p*100)||0:null,avg:!share});
  }
  return out;
}

  for(let b=1;b<=5;b++){ const yc=yPx((b-1)*100+50), lines=BAND_TXT[b], y0=yc-(lines.length-1)*11;
    lines.forEach((t,k)=>{ const sub=t.startsWith("("); s+=T(963,y0+k*22,t,{size:sub?14:16.5,bold:!sub,fill:sub?"#222":NAVY}); }); }

function arrowSVG(x,y1,y2,color){
  const up=y2<y1, len=Math.abs(y2-y1); if(len<7) return "";
  const hl=Math.min(15,len*.75), hw=Math.min(8,hl*.55+1.5), hb=up?y2+hl:y2-hl, X=x.toFixed(1);
  const stem=len>hl+2?`<line x1="${X}" x2="${X}" y1="${y1.toFixed(1)}" y2="${hb.toFixed(1)}" stroke="${color}" stroke-width="3.6"/>`:"";
  return stem+`<polygon points="${X},${y2.toFixed(1)} ${(x-hw).toFixed(1)},${hb.toFixed(1)} ${(x+hw).toFixed(1)},${hb.toFixed(1)}" fill="${color}"/>`;
}

async function runTableau(){
  const ws=tableau.extensions.worksheetContent.worksheet;
  const PROMPT='<p style="font:15px Arial;padding:24px;color:#002855">Drag <b>segment number</b> onto <b>Segment</b>, and <b>customer</b> and <b>market</b> (counts or % comp) onto <b>Customer</b> / <b>Market</b> &ndash; or an <b>Index</b> &ndash; on the Marks card.</p>';
  let busy=false, hasChart=false;
  const prompt=()=>{ hasChart=false; stage.innerHTML=PROMPT; msg.style.display="none"; };
  const refresh=async()=>{
    if(busy) return; busy=true;
    try{
      // 1) which fields are on which tile? (no data requested until a Segment field exists)
      let spec; try{ spec=await ws.getVisualSpecificationAsync(); }catch(e){ prompt(); return; }
      const list=spec&&spec.marksSpecifications||[];
      const mc=list[spec.activeMarksSpecificationIndex]||list[0];
      if(!mc||!mc.encodings){ prompt(); return; }
      const map={}; for(const e of mc.encodings){ if(e.field) map[e.id]=e.field.name; }
      if(!map.segment){ prompt(); return; }
      // 2) now read the data
      let table;
      try{ const reader=await ws.getSummaryDataReaderAsync(); table=await reader.getAllPagesAsync(); await reader.releaseAsync(); }
      catch(e){ table=await ws.getSummaryDataAsync(); }
      const col=id=>map[id]==null?-1:table.columns.findIndex(c=>c.fieldName===map[id]);
      const ci={seg:col("segment"),cust:col("customer"),mkt:col("market"),idx:col("index")};
      if(ci.seg<0){ prompt(); return; }
      const rows=table.data.map(r=>({seg:r[ci.seg].value, cust:ci.cust>=0?num(r[ci.cust].value):null, mkt:ci.mkt>=0?num(r[ci.mkt].value):null, idx:ci.idx>=0?num(r[ci.idx].value):null}));
      show(rows); hasChart=true;
    }catch(e){ console.error(e); hasChart=false; msg.style.display="block"; msg.textContent="Waiting for data ("+e.message+")"; }
    finally{ busy=false; }
  };
  ws.addEventListener(tableau.TableauEventType.SummaryDataChanged,refresh);
  await refresh();
  setInterval(()=>{ if(!hasChart) refresh(); },2000);   // keep checking until fields are dropped on the tiles
}

/* ---------- read an .xlsx with no external library (zip + xml) ---------- */
async function inflateRaw(u8){
  if(typeof DecompressionStream==="undefined") throw new Error("This browser can't open .xlsx directly - save the sheet as CSV, or use Chrome/Edge/Safari 16.4+/Firefox 113+.");
  const ds=new DecompressionStream("deflate-raw");

}
async function unzip(buf){

  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65600);i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error("That doesn't look like an .xlsx file.");
  const n=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true); const files={}, dec=new TextDecoder();
  for(let k=0;k<n;k++){

    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    files[dec.decode(u8.subarray(p+46,p+46+nl))]={method,csize,off}; p+=46+nl+el+cl;
  }
  return {async read(name){ const f=files[name]; if(!f) return null; const nl=dv.getUint16(f.off+26,true), el=dv.getUint16(f.off+28,true);
    const data=u8.subarray(f.off+30+nl+el,f.off+30+nl+el+f.csize); return dec.decode(f.method===0?data:await inflateRaw(data)); }};
}
const xml=t=>new DOMParser().parseFromString(t,"text/xml");
const colNum=ref=>{let n=0; for(const ch of /^[A-Z]+/.exec(ref)[0]) n=n*26+ch.charCodeAt(0)-64; return n-1;};
async function readXlsx(buf){
  const z=await unzip(buf);
  const wb=xml(await z.read("xl/workbook.xml")), rels=xml(await z.read("xl/_rels/workbook.xml.rels"));
  const target={}; for(const r of rels.getElementsByTagName("Relationship")){ let t=r.getAttribute("Target"); target[r.getAttribute("Id")]=t.startsWith("/")?t.slice(1):"xl/"+t; }
  const ss=[]; const sst=await z.read("xl/sharedStrings.xml");
  if(sst) for(const si of xml(sst).getElementsByTagName("si")) ss.push([...si.getElementsByTagName("t")].map(t=>t.textContent).join(""));
  const sheets=[];
  for(const sh of wb.getElementsByTagName("sheet")){
    const rid=sh.getAttribute("r:id")||sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
    const txt=await z.read(target[rid]); if(!txt) continue;

      else if(v){ val = t==="s"?ss[+v.textContent] : (t==="str"||t==="b"||t==="e")?v.textContent : parseFloat(v.textContent); }
      if(val===null||val==="") continue;

    }

/* ---------- find the table inside a sheet (handles title rows, 2-level headers, Total row) ---------- */
function findTable(grid){
  const segRe=/^segment[\s_]*(number|no\.?|#|id|code)?$/i;
  for(let r=0;r<grid.length;r++){
    const row=grid[r]; if(!row) continue;
    for(let c=0;c<row.length;c++){
      if(row[c]==null||!segRe.test(String(row[c]).trim())) continue;
      const hdr=row, up=grid[r-1]||[], last=c+14, col={};
      const owner=(cc,t)=>{ if(/customer/.test(t))return"cust"; if(/market/.test(t))return"mkt";
        for(let k=cc;k>c;k--){ const g=String(up[k]==null?"":up[k]).toLowerCase(); if(/customer/.test(g))return"cust"; if(/market/.test(g))return"mkt"; } return null; };
      for(let cc=c+1;cc<=last&&cc<hdr.length;cc++){
        if(hdr[cc]==null) continue; const t=String(hdr[cc]).trim().toLowerCase();
        if(/^(index|idx)$/.test(t)){ if(col.idx==null) col.idx=cc; continue; }
        if(/name/.test(t)){ if(col.name==null) col.name=cc; continue; }
        const o=owner(cc,t); if(!o) continue;
        const kind=/%|comp|pct|percent/.test(t)?"pct":/count|household|hh|records|base/.test(t)?"count":null;
        if(kind && col[o+"_"+kind]==null) col[o+"_"+kind]=cc;
      }
      const rows=[]; let others=0;
      for(let rr=r+1;rr<grid.length;rr++){
        const g=grid[rr]||[]; const sv=String(g[c]==null?"":g[c]).trim();
        if(!/^\d{1,3}$/.test(sv)) continue;
        const n=k=>col[k]==null?null:num(g[col[k]]);
        rows.push({seg:sv, name:col.name!=null?g[col.name]:null,
          cust:n("cust_count")!=null?n("cust_count"):n("cust_pct"), mkt:n("mkt_count")!=null?n("mkt_count"):n("mkt_pct"),
          idx:col.idx!=null?n("idx"):null});
      }
      return {rows,col,header:r+1};
    }
  }
  return null;
}
function csvToGrid(text){
  const lines=text.replace(/^\ufeff/,"").split(/\r?\n/).filter(l=>l.trim()); if(!lines.length) return [];
  const d=(lines[0].match(/\t/g)||[]).length>=(lines[0].match(/,/g)||[]).length&&lines[0].includes("\t")?"\t":",";
  return lines.map(l=>{const out=[]; let cur="",q=false; for(const ch of l){ if(ch==='"'){q=!q;} else if(ch===d&&!q){out.push(cur);cur="";} else cur+=ch; } out.push(cur); return out.map(x=>x.trim()===""?undefined:x.trim()); });
}
async function loadTables(file,pasted){
  const out=[];
  if(file){
    if(/\.(xlsx|xlsm)$/i.test(file.name)){
      for(const sh of await readXlsx(await file.arrayBuffer())){ const t=findTable(sh.grid); if(t&&t.rows.length) out.push({name:sh.name,rows:t.rows,col:t.col}); }
    } else { const t=findTable(csvToGrid(await file.text())); if(t&&t.rows.length) out.push({name:file.name.replace(/\.[^.]+$/,""),rows:t.rows,col:t.col}); }
  } else { const t=findTable(csvToGrid(pasted)); if(t&&t.rows.length) out.push({name:"pasted table",rows:t.rows,col:t.col}); }
  if(!out.length) throw new Error("Couldn't find a table with a 'Segment Number' column and segment rows in "+(file?file.name:"the pasted text")+".");
  const full=out.filter(t=>t.rows.length>=50);      // real distribution sheets have all 72 segments; skips partial/summary tabs

}

    const r=buildCompareSVG(selr.rows,{view:S.view,prevLabel:plabel.value.trim()||"Previous",curLabel:clabel.value.trim()||"Current",subtitle:window.__subtitle||CONFIG.SUBTITLE,lifes:S.lifes,hdr:S.hdr[S.view],rollup:S.view==="life"?lifeRollup(S.all,S.lifes):null});
    S.heads=r.heads; S.defaults=r.defaults; present(r.svg); msg.style.display="none"; chipC.hidden=chipM.hidden=true;
    window.__tag=t.name+"_compare_"+(S.view==="life"?"lifestage":"movement"); window.__result={count:selr.rows.length,haveShare:true,compare:true,shown:S.shown};
    exp.forEach(b=>b.disabled=false);
    const notes=[];
    if(cmp.unmatched) notes.push(cmp.unmatched+" segment(s) in the current file weren't in the previous file.");
    if(selr.total>selr.rows.length) notes.push("Showing "+selr.rows.length+" of "+selr.total+" matching segments \u2013 raise Max (up to 10) or narrow the filters.");
    if(!selr.rows.length) notes.push("No segments match the current selection \u2013 try another \u201cShow\u201d option.");
    adjEl.textContent=notes.join("  ");
    status.textContent='Comparing "'+t.name+'" with "'+pt.name+'" \u2013 '+cmp.rows.length+' segments matched.';
  };
  const refresh=()=>{
    if(!window.__tables) return; const i=+sel.value, t=window.__tables[i];
    if(S.compare&&S.prev) drawCompare(t); else { drawStandard(i); if(S.compare) status.textContent+="  Compare is on \u2013 choose the previous year's file."; }
  };

  /* ----- current file ----- */
  const go=async()=>{
    msg.style.display="none";
    try{
      const f=fileEl.files[0], pasted=paste.value;
      if(!f && !pasted.trim()) throw new Error("Choose your distribution file first, then click Render.");
      const prev=window.__tag; window.__tables=await loadTables(f,pasted);
      sel.innerHTML=window.__tables.map((t,i)=>'<option value="'+i+'">'+esc(t.name)+'</option>').join("");
      wrap.hidden=window.__tables.length<2;
      const keep=window.__tables.findIndex(t=>t.name===prev); sel.value=String(keep>=0?keep:0);
      if(!S.dirty.c) clabel.value=yr(f&&f.name)||yr(window.__tables[+sel.value].name)||"";
      refresh();
    }catch(e){ fail(e); }
  };
  const ready=()=>{ goBtn.disabled=!(fileEl.files[0]||paste.value.trim()); };
  goBtn.onclick=go; sel.onchange=refresh; paste.oninput=ready;
  force.onchange=()=>{ window.__force100=force.checked; refresh(); };
  fileEl.onchange=()=>{ const f=fileEl.files[0]; fname_.textContent=f?f.name:DEFAULT_FILE; status.textContent=f?'Ready \u2013 click Render.':""; ready(); if(!window.__lastSVG) stage.innerHTML=emptyHTML(); };
  subEl.oninput=()=>{ window.__subtitle=subEl.value.trim(); refresh(); };

  /* ----- compare controls ----- */
  cmpBtn.onclick=()=>{ S.compare=!S.compare; $("cmpBadge").hidden=!S.compare; cmpBtn.classList.toggle("on",S.compare); cmpBtn.setAttribute("aria-pressed",S.compare); panel.hidden=!S.compare; refresh(); };
  pfile.onchange=async()=>{
    const f=pfile.files[0]; if(!f) return;
    try{
      const tables=await loadTables(f,""); S.prev={tables,name:f.name};
      psel.innerHTML=tables.map((t,i)=>'<option value="'+i+'">'+esc(t.name)+'</option>').join(""); pwrap.hidden=tables.length<2;
      const cur=window.__tables&&window.__tables[+sel.value]; const m=cur?tables.findIndex(t=>t.name===cur.name):-1; psel.value=String(m>=0?m:0);
      pname.textContent=f.name; msg.style.display="none";
      if(!S.dirty.p) plabel.value=yr(f.name)||yr(tables[+psel.value].name)||"";
      refresh();
    }catch(e){ fail(e); }
  };
  psel.onchange=()=>{ if(!S.dirty.p&&S.prev) plabel.value=yr(S.prev.name)||yr(S.prev.tables[+psel.value].name)||""; refresh(); };
  plabel.oninput=()=>{ S.dirty.p=true; refresh(); }; clabel.oninput=()=>{ S.dirty.c=true; refresh(); };
  qa("#viewSeg button").forEach(b=>b.onclick=()=>{ S.view=b.dataset.view; qa("#viewSeg button").forEach(x=>x.classList.toggle("on",x===b)); dirChips.hidden=S.view!=="move"; lifeChips.hidden=S.view!=="life"; refresh(); });
  presetEl.onchange=()=>{ S.preset=presetEl.value; picker.hidden=S.preset!=="custom"; if(S.preset==="custom"&&!S.custom.size) S.custom=new Set(S.shown); refresh(); syncChecks(); };
  maxEl.oninput=()=>{ S.max=Math.max(1,Math.min(10,parseInt(maxEl.value,10)||8)); refresh(); };
  qa("#dirChips .tog").forEach(b=>b.onclick=()=>{ S.dirs[b.dataset.dir]=!S.dirs[b.dataset.dir]; b.classList.toggle("on",S.dirs[b.dataset.dir]); refresh(); });
  qa("#lifeChips .tog").forEach(b=>b.onclick=()=>{ const k=b.dataset.life; S.lifes.has(k)?S.lifes.delete(k):S.lifes.add(k); b.classList.toggle("on",S.lifes.has(k)); refresh(); });
  picker.addEventListener("change",e=>{ if(e.target.type==="checkbox"){ const v=+e.target.value; e.target.checked?S.custom.add(v):S.custom.delete(v); refresh(); } });
  picker.addEventListener("input",e=>{ if(e.target.id==="psearch"){ const q=e.target.value.trim().toLowerCase(); qa("#picker label").forEach(l=>l.hidden=!!q&&!l.dataset.t.includes(q)); } });
  picker.addEventListener("click",e=>{ if(e.target.id==="pclear"){ S.custom.clear(); syncChecks(); refresh(); } if(e.target.id==="pshown"){ S.custom=new Set(S.shown); syncChecks(); refresh(); } });

  /* ----- click a table header on the chart to rename it ----- */
  stage.addEventListener("click",e=>{
    const h=e.target.closest&&e.target.closest(".hdrhit"); if(!h||!S.compare||!S.heads.length) return;
    const k=+h.dataset.k, r=h.getBoundingClientRect(); qa(".hdredit").forEach(x=>x.remove());
    const inp=document.createElement("input"); inp.className="hdredit"; inp.value=S.heads[k]; inp.maxLength=26; inp.setAttribute("aria-label","Table header");
    Object.assign(inp.style,{position:"fixed",left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px",font:"700 "+Math.max(11,Math.min(15,r.height*.27))+"px Arial,sans-serif",textAlign:"center",border:"2px solid #0a4fb4",borderRadius:"4px",background:"#fff",color:"#002855",zIndex:60,boxSizing:"border-box",outline:"none"});
    document.body.appendChild(inp); inp.focus(); inp.select();
    let done=false; const commit=ok=>{ if(done) return; done=true; if(ok){ const v=inp.value.trim(); S.hdr[S.view][k]=(v&&v.toUpperCase()!==S.defaults[k])?v:null; } inp.remove(); refresh(); };
    inp.onkeydown=ev=>{ if(ev.key==="Enter") commit(true); else if(ev.key==="Escape") commit(false); };
    inp.onblur=()=>commit(true);
  });
  $("hdrReset").onclick=()=>{ S.hdr={move:[null,null,null,null],life:[null,null,null,null]}; refresh(); };

  /* ----- start over ----- */
  const reset=()=>{
    fileEl.value=""; paste.value=""; pfile.value=""; window.__tables=null; window.__tag=null; window.__lastSVG=null; window.__result=null; window.__subtitle=""; subEl.value="";
    sel.innerHTML=""; wrap.hidden=true; psel.innerHTML=""; pwrap.hidden=true; status.textContent=""; adjEl.textContent=""; chipC.hidden=chipM.hidden=true; msg.style.display="none";
    fname_.textContent=DEFAULT_FILE; pname.textContent=DEFAULT_PREV; plabel.value=""; clabel.value="";
    Object.assign(S,{hdr:{move:[null,null,null,null],life:[null,null,null,null]},compare:false,view:"move",preset:"changed",max:8,prev:null,all:[],shown:[],pickKey:"",custom:new Set(),dirty:{p:false,c:false},dirs:{up:true,down:true},lifes:new Set(LIFE_ORDER)});
    cmpBtn.classList.remove("on"); cmpBtn.setAttribute("aria-pressed","false"); $("cmpBadge").hidden=true; panel.hidden=true; picker.hidden=true; picker.innerHTML="";
    qa("#viewSeg button").forEach(x=>x.classList.toggle("on",x.dataset.view==="move")); dirChips.hidden=false; lifeChips.hidden=true; presetEl.value="changed"; maxEl.value=8;
    qa("#dirChips .tog,#lifeChips .tog").forEach(x=>x.classList.add("on"));
    exp.forEach(b=>b.disabled=true); ready(); stage.innerHTML=emptyHTML();
  };
  $("newchart").onclick=reset;
  window.addEventListener("dragover",e=>{e.preventDefault(); document.body.classList.add("dragging");});
  window.addEventListener("dragleave",e=>{ if(!e.relatedTarget) document.body.classList.remove("dragging"); });
  window.addEventListener("drop",e=>{ e.preventDefault(); document.body.classList.remove("dragging");
    const f=e.dataTransfer.files[0]; if(f){ const dt=new DataTransfer(); dt.items.add(f); fileEl.files=dt.files; fileEl.onchange(); go(); } });
  const fname=ext=>"brand_preference_index"+(window.__tag?"_"+String(window.__tag).replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,""):"")+"."+ext;
  const dl=(blob,name)=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();};
  const toPng=(svg,name)=>{ const img=new Image(); img.onload=()=>{const c=document.createElement("canvas");c.width=W*2;c.height=H*2;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>dl(b,name));}; img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg); };
  $("dlsvg").onclick=()=>window.__lastSVG&&dl(new Blob([window.__lastSVG],{type:"image/svg+xml"}),fname("svg"));
  $("dlpng").onclick=()=>window.__lastSVG&&toPng(window.__lastSVG,fname("png"));
  window.__force100=force.checked; stage.innerHTML=emptyHTML();
}

function loadScript(src){return new Promise(res=>{const s=document.createElement("script");s.src=src;s.onload=()=>res(true);s.onerror=()=>res(false);document.head.appendChild(s);});}
(async function boot(){
  const force=new URLSearchParams(location.search).has("standalone");
  if(!force && await loadScript("tableau.extensions.1.latest.js") && window.tableau && tableau.extensions){
    try{
      await Promise.race([tableau.extensions.initializeAsync(), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),3000))]);
      await runTableau(); return;
    }catch(e){ console.warn("Not running inside Tableau, using standalone mode:",e.message); }
  }
  runStandalone();
})();
</script>
</body>
