<!DOCTYPE html>
<!--
  Car Fill — Viz Extension (v2: category-driven segments)
  ----------------------------------------------------------
  Runs as a MARK TYPE on the worksheet's Marks card (under Viz Extensions).

  Data model:
  - "Category" (dimension) — e.g. Net New: "Y" or "" (blank)
  - "Total" (measure) — e.g. CNTD(VehicleVin), totaled per category value

  Blank/empty category values become the "remaining" band (drawn at the
  top of the car). Any non-blank category value gets its own colored band,
  stacked at the bottom, in descending order of size. This generalizes to
  more than one non-blank category value if that ever comes up, though the
  original ask was just Y vs blank.

  Colors are configurable per category value via the "Colors" button drawn
  on the visual itself, saved through tableau.extensions.settings so they
  persist across sessions.

  Optional "Tooltip" and "Label" tiles behave the same as before: Tooltip
  shows a hover tooltip with a chosen measure; Label overrides the default
  subtitle text with a calculated field's value.
-->
<html>
<head>
<meta charset="utf-8" />
<title>Car Fill</title>
<script src="./tableau.extensions.1.latest.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
  }
  #outer {
    position: relative;
    height: 100vh;
    box-sizing: border-box;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    box-sizing: border-box;
    padding: 8px;
  }
  #pct-label {
    font-size: 28px;
    font-weight: 700;
    color: #1F4E5F;
    margin-top: 6px;
  }
  #sub-label {
    font-size: 13px;
    color: #5b7a86;
    margin-top: 2px;
  }
  #status {
    font-size: 12px;
    color: #888;
    text-align: center;
    padding: 20px;
  }
  #hover-tooltip {
    position: fixed;
    pointer-events: none;
    background: #1F4E5F;
    color: #fff;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 4px;
    white-space: nowrap;
    display: none;
    z-index: 1000;
  }
  #config-toggle {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 11px;
    background: #eee;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 3px 8px;
    cursor: pointer;
    color: #444;
    z-index: 10;
  }
  #config-panel {
    position: absolute;
    top: 30px;
    right: 6px;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 20;
    display: none;
    font-size: 12px;
    color: #333;
    min-width: 160px;
  }
  #config-panel .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  #config-panel button {
    margin-top: 6px;
    width: 100%;
    padding: 4px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="outer">
  <button id="config-toggle">Colors</button>
  <div id="config-panel"></div>
  <div id="wrap">
    <div id="status">Loading…</div>
  </div>
  <div id="hover-tooltip"></div>
</div>

<script>
(function () {
  // ---- Tunable constants ----
  const DEFAULT_PALETTE = ["#4A90C4", "#E8973F", "#7FA92F", "#B5548C", "#4AA8A0"]; // non-blank category colors, in order
  const EMPTY_COLOR = "#1F4E5F";   // default color for blank/"remaining" band
  const DIVIDER_COLOR = "#FFFFFF";
  const DIVIDER_THICKNESS = 28;    // viewBox units
  const PCT_DECIMALS = 0;          // decimal places on the percentage, e.g. 1 -> "18.6%"
  const PCT_SUFFIX = "";           // text appended after the %, e.g. " filled" -> "19% filled"

  // Car silhouette path (car.svg) and its bounding box within the viewBox.
  const CAR_PATH = "M4628.33,910.33c0-47.59-16.55-111.73-120-111.73h-370.35c-40.19,0-68.43,23.91-87.18,49.6l-323.69-532.91c-34.88-57.43-77.21-110-125.87-156.33h0C3459.52,24.02,3271.32,0,3075.63,0h-1522.51c-195.69,0-383.89,24.02-525.61,158.96h0c-48.66,46.33-90.99,98.9-125.87,156.33l-323.69,532.91c-18.75-25.69-46.98-49.6-87.18-49.6H120.42C16.96,798.6.41,862.74.41,910.33S-.06,1024.74,0,1033.22c.23,28.93,9.52,104.26,99.72,106.77,81.62,2.27,227.81,1.22,300.69.49l-52.85,87.01c-44.44,70.14-82.87,143.9-114.91,220.5h0c-75.44,180.4-114.29,373.99-114.29,569.53v1225.68c0,64.32,52.14,116.45,116.45,116.45h487.41c64.32,0,116.45-52.14,116.45-116.45v-271.95h2951.37v271.95c0,64.32,52.14,116.45,116.45,116.45h487.41c64.32,0,116.45-52.14,116.45-116.45v-418.03h0v-807.65c0-195.54-38.85-389.13-114.29-569.53h0c-32.03-76.6-70.47-150.36-114.91-220.5l-52.85-87.01c72.88.73,219.08,1.77,300.69-.49,90.2-2.51,99.49-77.83,99.72-106.77.07-8.49-.41-73.21-.41-122.89ZM1354.34,1949.24l-154.49,128.73c-50.35,41.96-116.53,65.27-185.24,65.27h-342.8c-59.31,0-117.94-11.97-171.11-35.56-80.67-35.79-163.01-85.58-173.1-128.61-14.12-60.2,10.04-200.19,20.63-225.54,10.59-25.35,35.31-85.55,102.4-72.87,54.44,10.28,657.57,145.74,883.07,196.46,36.34,8.17,48.09,49.25,20.64,72.13ZM689.88,1191.65s-141.24,10.59-45.9-141.24c68.29-108.76,265.21-425.86,371.44-597.03,44.86-72.27,99.56-138.01,163.02-194.65,52.56-46.92,102.18-79.33,221.16-83.99,180.08-7.06,914.77,0,914.77,0,0,0,734.69-7.06,914.77,0,118.98,4.67,168.6,37.08,221.16,83.99,63.46,56.64,118.16,122.38,163.02,194.65,106.23,171.17,303.16,488.27,371.44,597.03,95.34,151.83-45.9,141.24-45.9,141.24H689.88ZM4280.52,1753.53c10.59,25.35,34.76,165.34,20.63,225.54-10.1,43.03-92.44,92.82-173.1,128.61-53.17,23.59-111.8,35.56-171.11,35.56h-342.8c-68.72,0-134.89-23.32-185.24-65.27l-154.49-128.73c-27.45-22.88-15.7-63.96,20.64-72.13,225.51-50.72,828.64-186.18,883.07-196.46,67.09-12.67,91.8,47.53,102.4,72.87Z";
  const VIEWBOX_W = 4628.75, VIEWBOX_H = 3359.66;
  const ICON_TOP = 0, ICON_BOTTOM = 3236.76;
  const BLANK_KEY = "__BLANK__";

  let worksheet = null;
  let colorMap = {};          // categoryKey -> hex color, persisted via settings
  let lastCategoryKeys = [];  // [{key, displayLabel}] from the most recent render, for the config panel

  window.onload = tableau.extensions.initializeAsync().then(() => {
    worksheet = tableau.extensions.worksheetContent.worksheet;

    loadColorMap();

    worksheet.addEventListener(
      tableau.TableauEventType.SummaryDataChanged,
      updateDataAndRender
    );

    document.getElementById("config-toggle").addEventListener("click", toggleConfigPanel);

    updateDataAndRender();
  }).catch(err => {
    document.getElementById("wrap").innerHTML =
      '<div id="status">Failed to initialize: ' + err.message + '</div>';
  });

  function loadColorMap() {
    try {
      const saved = tableau.extensions.settings.get("colorMap");
      colorMap = saved ? JSON.parse(saved) : {};
    } catch (e) {
      colorMap = {};
    }
  }

  function saveColorMap() {
    tableau.extensions.settings.set("colorMap", JSON.stringify(colorMap));
    return tableau.extensions.settings.saveAsync();
  }

  function categoryKeyFor(rawValue) {
    if (rawValue === null || rawValue === undefined || rawValue === "") return BLANK_KEY;
    return String(rawValue);
  }

  function colorForCategory(key, nonBlankIndex) {
    if (colorMap[key]) return colorMap[key];
    if (key === BLANK_KEY) return EMPTY_COLOR;
    return DEFAULT_PALETTE[nonBlankIndex % DEFAULT_PALETTE.length];
  }

  // Reads the Marks card and returns the field name (or null) dropped onto
  // each encoding tile: category, total, tooltipMeasure, label.
  async function getEncodedFields() {
    const visualSpec = await worksheet.getVisualSpecificationAsync();
    const marksCard = visualSpec.marksSpecifications[visualSpec.activeMarksSpecificationIndex];

    const result = { category: null, total: null, tooltipMeasure: null, label: null };
    for (const encoding of marksCard.encodings) {
      if (encoding.id === "category" && encoding.field) result.category = encoding.field.name;
      if (encoding.id === "total" && encoding.field) result.total = encoding.field.name;
      if (encoding.id === "tooltipMeasure" && encoding.field) result.tooltipMeasure = encoding.field.name;
      if (encoding.id === "label" && encoding.field) result.label = encoding.field.name;
    }
    return result;
  }

  async function updateDataAndRender() {
    try {
      const { category, total, tooltipMeasure, label } = await getEncodedFields();

      if (!category || !total) {
        document.getElementById("wrap").innerHTML =
          '<div id="status">Drag a dimension onto <b>Category</b> (e.g. Net New) and a measure onto <b>Total</b> (e.g. CNTD(VehicleVin)) on the Marks card.</div>';
        return;
      }

      const data = await worksheet.getSummaryDataAsync();
      const colIndexCategory = data.columns.findIndex(c => c.fieldName === category);
      const colIndexTotal = data.columns.findIndex(c => c.fieldName === total);
      const colIndexTooltip = tooltipMeasure ? data.columns.findIndex(c => c.fieldName === tooltipMeasure) : -1;
      const colIndexLabel = label ? data.columns.findIndex(c => c.fieldName === label) : -1;

      if (colIndexCategory === -1 || colIndexTotal === -1) {
        document.getElementById("wrap").innerHTML =
          '<div id="status">Could not find the encoded fields in the summary data.</div>';
        return;
      }

      // Aggregate totals per distinct category value.
      const totalsByKey = {};       // key -> summed total
      const displayLabelByKey = {}; // key -> the original display string (e.g. "Y")
      let tooltipVal = 0, tooltipFormatted = null, labelText = null;

      data.data.forEach(row => {
        const rawCatValue = row[colIndexCategory].value;
        const key = categoryKeyFor(rawCatValue);
        const rowTotal = Number(row[colIndexTotal].value) || 0;

        totalsByKey[key] = (totalsByKey[key] || 0) + rowTotal;
        if (!(key in displayLabelByKey)) {
          displayLabelByKey[key] = key === BLANK_KEY ? "(blank)" : row[colIndexCategory].formattedValue;
        }

        if (colIndexTooltip !== -1) {
          tooltipVal += Number(row[colIndexTooltip].value) || 0;
          tooltipFormatted = row[colIndexTooltip].formattedValue;
        }
        if (colIndexLabel !== -1 && labelText === null) {
          labelText = row[colIndexLabel].formattedValue;
        }
      });

      const grandTotal = Object.values(totalsByKey).reduce((a, b) => a + b, 0);
      const blankTotal = totalsByKey[BLANK_KEY] || 0;
      const highlightedTotal = grandTotal - blankTotal;
      const pct = grandTotal > 0 ? highlightedTotal / grandTotal : 0;

      // Build stacking order: non-blank categories (largest first) at the
      // bottom, blank/remaining band last (drawn at the top).
      const nonBlankKeys = Object.keys(totalsByKey)
        .filter(k => k !== BLANK_KEY)
        .sort((a, b) => totalsByKey[b] - totalsByKey[a]);

      const segments = nonBlankKeys.map((key, i) => ({
        key,
        total: totalsByKey[key],
        color: colorForCategory(key, i)
      }));
      if (BLANK_KEY in totalsByKey) {
        segments.push({ key: BLANK_KEY, total: totalsByKey[BLANK_KEY], color: colorForCategory(BLANK_KEY, 0) });
      }

      lastCategoryKeys = Object.keys(totalsByKey).map((key, i) => ({
        key,
        label: displayLabelByKey[key],
        color: colorForCategory(key, nonBlankKeys.indexOf(key))
      }));

      drawCar(segments, grandTotal);
      document.getElementById("pct-label").textContent = (pct * 100).toFixed(PCT_DECIMALS) + "%" + PCT_SUFFIX;
      document.getElementById("sub-label").textContent = labelText !== null
        ? labelText
        : highlightedTotal.toLocaleString() + " / " + grandTotal.toLocaleString();

      setupHoverTooltip(tooltipMeasure, tooltipFormatted !== null ? tooltipFormatted : tooltipVal.toLocaleString());
      renderConfigPanel();
    } catch (err) {
      document.getElementById("wrap").innerHTML =
        '<div id="status">Error: ' + err.message + '</div>';
    }
  }

  function setupHoverTooltip(fieldName, formattedValue) {
    const carSvg = document.getElementById("car-svg");
    const tooltip = document.getElementById("hover-tooltip");
    if (!carSvg) return;

    if (!fieldName) {
      carSvg.onmousemove = null;
      carSvg.onmouseleave = null;
      tooltip.style.display = "none";
      return;
    }

    carSvg.onmousemove = (e) => {
      tooltip.textContent = fieldName + ": " + formattedValue;
      tooltip.style.left = (e.clientX + 12) + "px";
      tooltip.style.top = (e.clientY + 12) + "px";
      tooltip.style.display = "block";
    };
    carSvg.onmouseleave = () => {
      tooltip.style.display = "none";
    };
  }

  // segments: array of {key, total, color}, ordered bottom-to-top.
  function drawCar(segments, grandTotal) {
    const iconHeight = ICON_BOTTOM - ICON_TOP;
    let cursorY = ICON_BOTTOM;

    const bands = segments.map(seg => {
      const proportion = grandTotal > 0 ? seg.total / grandTotal : 0;
      const bandHeight = iconHeight * proportion;
      const yTop = cursorY - bandHeight;
      const band = { ...seg, yTop, yBottom: cursorY };
      cursorY = yTop;
      return band;
    });

    let rects = bands.map(b =>
      `<rect x="0" y="${b.yTop}" width="${VIEWBOX_W}" height="${b.yBottom - b.yTop}" fill="${b.color}"/>`
    ).join("");

    // Divider lines at each internal boundary between bands.
    let dividers = "";
    for (let i = 0; i < bands.length - 1; i++) {
      const boundaryY = bands[i].yTop;
      dividers += `<rect x="0" y="${boundaryY - DIVIDER_THICKNESS / 2}" width="${VIEWBOX_W}" height="${DIVIDER_THICKNESS}" fill="${DIVIDER_COLOR}"/>`;
    }

    const svg = `
      <svg id="car-svg" viewBox="0 0 ${VIEWBOX_W} ${VIEWBOX_H}" width="240" height="${Math.round(240 * VIEWBOX_H / VIEWBOX_W)}" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="carShape">
            <path d="${CAR_PATH}"/>
          </clipPath>
        </defs>
        <g clip-path="url(#carShape)">
          <rect x="0" y="0" width="${VIEWBOX_W}" height="${VIEWBOX_H}" fill="${EMPTY_COLOR}"/>
          ${rects}
          ${dividers}
        </g>
      </svg>
    `;

    document.getElementById("wrap").innerHTML = svg +
      '<div id="pct-label"></div><div id="sub-label"></div>';
  }

  function toggleConfigPanel() {
    const panel = document.getElementById("config-panel");
    panel.style.display = panel.style.display === "block" ? "none" : "block";
  }

  function renderConfigPanel() {
    const panel = document.getElementById("config-panel");
    if (lastCategoryKeys.length === 0) {
      panel.innerHTML = '<div>No categories yet.</div>';
      return;
    }

    const rows = lastCategoryKeys.map(c =>
      `<div class="row">
        <span>${c.label}</span>
        <input type="color" data-key="${c.key}" value="${c.color}">
      </div>`
    ).join("");

    panel.innerHTML = rows + '<button id="save-colors-btn">Save colors</button>';

    document.getElementById("save-colors-btn").onclick = async () => {
      panel.querySelectorAll("input[type=color]").forEach(input => {
        colorMap[input.dataset.key] = input.value;
      });
      await saveColorMap();
      panel.style.display = "none";
      updateDataAndRender();
    };
  }
})();
</script>
</body>
</html>
