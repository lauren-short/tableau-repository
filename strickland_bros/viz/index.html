<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Gauge Viz Extension</title>
<script src="tableau.extensions.1.latest.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: sans-serif; }
  #gaugeWrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .segment { cursor: pointer; }
  .segment:hover { opacity: 0.85; }
  .digital { fill: #ffffff; font-family: monospace; font-weight: 700; letter-spacing: 2px; }
</style>
</head>
<body>
<div id="gaugeWrap"><svg id="gauge" width="400" height="400" viewBox="0 0 400 400"></svg></div>
<div id="tooltip" style="position:fixed; display:none; pointer-events:none; background:#12203a; color:#fff; font-family:sans-serif; font-size:12px; padding:6px 10px; border-radius:6px; z-index:1000;"></div>
<div id="error" style="color:#c0392b; font-family:sans-serif; font-size:12px; padding:8px; display:none;"></div>

<script>
// ---- Palette for up to 6 categories (falls back to gray beyond that) ----
var PALETTE = ["#1D9E75", "#BA7517", "#D85A30", "#378ADD", "#993556", "#888780"];

var worksheet;

function showError(err) {
  var el = document.getElementById("error");
  el.style.display = "block";
  el.textContent = "Gauge extension error: " + (err && err.message ? err.message : err);
  console.error(err);
}

tableau.extensions.initializeAsync().then(function () {
  worksheet = tableau.extensions.worksheetContent.worksheet;
  render();
  worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, render);
}).catch(showError);

function render() {
  worksheet.getVisualSpecificationAsync().then(function (visualSpec) {
    var marksSpec = visualSpec.marksSpecifications[visualSpec.activeMarksSpecificationIndex];
    if (!marksSpec) { showError("No active marksSpecification found."); return; }

    // Map our custom encoding ids (declared in the .trex) to the fields dropped on them.
    // NOTE: reading both `.id` and `.fieldId` defensively — the exact property name
    // on FieldInstance wasn't something I could verify with certainty, and guessing
    // wrong here would silently break everything below with no visible error.
    function getFieldId(enc) {
      if (!enc.field) return null;
      return enc.field.id || enc.field.fieldId || null;
    }
    var colorFieldId = null, angleFieldId = null, sizeFieldId = null, labelFieldId = null;
    var colorEncPresent = false, angleEncPresent = false;
    marksSpec.encodings.forEach(function (enc) {
      console.log("Encoding on marks card:", enc.id, enc.field);
      if (enc.id === "color") { colorEncPresent = colorEncPresent || !!enc.field; colorFieldId = getFieldId(enc) || colorFieldId; }
      if (enc.id === "angle") { angleEncPresent = angleEncPresent || !!enc.field; angleFieldId = getFieldId(enc) || angleFieldId; }
      if (enc.id === "size") sizeFieldId = getFieldId(enc) || sizeFieldId;
      if (enc.id === "label") labelFieldId = getFieldId(enc) || labelFieldId;
    });
    // Nothing dropped yet — normal state for a blank sheet, no error needed
    if (!colorEncPresent || !angleEncPresent) return;
    // Fields ARE present but we couldn't read an id off them — that's a real bug
    if (!colorFieldId || !angleFieldId) {
      showError("Color/Angle fields are present but no id/fieldId property resolved — check console log above for the real Encoding.field shape.");
      return;
    }

    // No pageRowCount/options needed — default reads all columns currently on the view
    worksheet.getSummaryDataReaderAsync().then(function (reader) {
      return reader.getAllPagesAsync().then(function (dataTable) {
        reader.releaseAsync();
        console.log("Full summary DataTable:", dataTable);
        drawGauge(dataTable, colorFieldId, angleFieldId, sizeFieldId, labelFieldId);
      });
    }).catch(showError);
  }).catch(showError);
}

function drawGauge(dataTable, colorFieldId, angleFieldId, sizeFieldId, labelFieldId) {
  var colorIdx = dataTable.columns.findIndex(function (c) { return c.fieldId === colorFieldId; });
  var angleIdx = dataTable.columns.findIndex(function (c) { return c.fieldId === angleFieldId; });
  var sizeIdx = sizeFieldId ? dataTable.columns.findIndex(function (c) { return c.fieldId === sizeFieldId; }) : -1;
  var labelIdx = labelFieldId ? dataTable.columns.findIndex(function (c) { return c.fieldId === labelFieldId; }) : -1;
  var totalRowCount = dataTable.totalRowCount;
  // VERIFY: dataTable.marksInfo should line up 1:1 with dataTable.data when a
  // field is dropped on the Color shelf and the user has customized the legend
  // (double-click a swatch in Tableau → pick a color, same as a native pie chart).
  // Log dataTable in the console to confirm marksInfo is actually populated.
  var marksInfo = dataTable.marksInfo;

  var segments = dataTable.data.map(function (row, rowIndex) {
    var userColor = marksInfo && marksInfo[rowIndex] ? marksInfo[rowIndex].color : null;
    var label = row[colorIdx].formattedValue;
    // Since custom viz-extension encodings don't get Tableau's native color legend,
    // persisted overrides (set by clicking a wedge below) take priority over any
    // marksInfo color or the default palette.
    var savedOverride = tableau.extensions.settings.get("color_" + label);
    return {
      label: label,
      value: row[angleIdx].value,
      formattedValue: row[angleIdx].formattedValue,
      // Per Tableau's docs: tupleId = totalRowCount - (1-based row number)
      tupleId: totalRowCount - (rowIndex + 1),
      color: savedOverride || userColor || PALETTE[rowIndex % PALETTE.length]
    };
  });

  var total = segments.reduce(function (sum, s) { return sum + s.value; }, 0) || 1;

  var svg = document.getElementById("gauge");
  svg.innerHTML = "";

  var cx = 200, cy = 200, r = 150;
  var bezelColor = "#12203a";
  var startAngle = -90; // 12 o'clock
  var sweep = 360;      // full circle, like the reference gauge
  var cumulative = 0;

  // Light base face (shows through if segments don't sum to the full circle)
  var face = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  face.setAttribute("cx", cx); face.setAttribute("cy", cy); face.setAttribute("r", r);
  face.setAttribute("fill", "#bfe0f5");
  svg.appendChild(face);

  // Solid pie wedges (fill from center out to the edge, not a thin donut ring)
  segments.forEach(function (seg, i) {
    var frac = seg.value / total;
    var a0 = startAngle + sweep * cumulative;
    var a1 = startAngle + sweep * (cumulative + frac);
    cumulative += frac;

    var el = document.createElementNS("http://www.w3.org/2000/svg", "path");
    el.setAttribute("d", describeWedge(cx, cy, r, a0, a1));
    el.setAttribute("fill", seg.color);
    el.setAttribute("class", "segment");
    el.addEventListener("mouseenter", function () {
      showTooltip(seg.label + ": " + seg.formattedValue);
    });
    el.addEventListener("mousemove", function (evt) {
      moveTooltip(evt.clientX, evt.clientY);
    });
    el.addEventListener("mouseleave", function () {
      hideTooltip();
    });
    el.addEventListener("click", function () {
      var input = window.prompt("Set a color for \"" + seg.label + "\" (hex, e.g. #1D9E75):", seg.color);
      if (input) {
        tableau.extensions.settings.set("color_" + seg.label, input);
        tableau.extensions.settings.saveAsync().then(render).catch(showError);
      }
    });
    svg.appendChild(el);
  });

  // Outer navy bezel ring, drawn on top of the wedges' outer edge
  var bezel = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  bezel.setAttribute("cx", cx); bezel.setAttribute("cy", cy); bezel.setAttribute("r", r);
  bezel.setAttribute("fill", "none");
  bezel.setAttribute("stroke", bezelColor);
  bezel.setAttribute("stroke-width", 14);
  svg.appendChild(bezel);

  // Tick marks all the way around, like a real gauge face
  drawTicks(svg, cx, cy, r - 10, 36, 3, 12);

  // Needle position: only trust the Size measure if it's actually a 0–1 fraction
  // (e.g. a "% of goal" calc). A raw dollar/count value would blow up the readout,
  // so fall back to the segments' own cumulative proportion instead.
  var rawSizeValue = (sizeIdx >= 0 && dataTable.data[0]) ? dataTable.data[0][sizeIdx].value : null;
  var needleFraction = (rawSizeValue !== null && rawSizeValue >= 0 && rawSizeValue <= 1) ? rawSizeValue : cumulative;
  var needleAngleDeg = startAngle + sweep * needleFraction;
  drawNeedle(svg, cx, cy, needleAngleDeg, r - 30);

  // Digital readout: prefer the Label shelf's formatted value, then the Color
  // field's own name (like the reference gauge's static "OIL TYPE" caption),
  // falling back to a percentage only if neither is available
  var colorFieldName = dataTable.columns[colorIdx] ? dataTable.columns[colorIdx].fieldName : null;
  var readoutText = (labelIdx >= 0 && dataTable.data[0])
    ? dataTable.data[0][labelIdx].formattedValue
    : (colorFieldName || (Math.round(needleFraction * 100) + "%"));
  drawReadout(svg, cx, cy + 90, readoutText, bezelColor);
}

function showTooltip(text) {
  var el = document.getElementById("tooltip");
  el.textContent = text;
  el.style.display = "block";
}

function moveTooltip(x, y) {
  var el = document.getElementById("tooltip");
  el.style.left = (x + 12) + "px";
  el.style.top = (y + 12) + "px";
}

function hideTooltip() {
  document.getElementById("tooltip").style.display = "none";
}

function drawNeedle(svg, cx, cy, angleDeg, length) {
  var rad = (angleDeg * Math.PI) / 180;
  var tipX = cx + length * Math.cos(rad);
  var tipY = cy + length * Math.sin(rad);
  // Perpendicular offset for the kite's shoulder points, tapering to a point at the tip
  var perp = rad + Math.PI / 2;
  var shoulderW = 7;
  var shoulderBack = 14; // how far back from center the widest point sits
  var backX = cx - shoulderBack * Math.cos(rad);
  var backY = cy - shoulderBack * Math.sin(rad);
  var leftX = backX + shoulderW * Math.cos(perp);
  var leftY = backY + shoulderW * Math.sin(perp);
  var rightX = backX - shoulderW * Math.cos(perp);
  var rightY = backY - shoulderW * Math.sin(perp);

  var needle = document.createElementNS("http://www.w3.org/2000/svg", "path");
  needle.setAttribute("d", ["M", tipX, tipY, "L", leftX, leftY, "L", rightX, rightY, "Z"].join(" "));
  needle.setAttribute("fill", "#12203a");
  svg.appendChild(needle);

  var hub = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  hub.setAttribute("cx", cx); hub.setAttribute("cy", cy); hub.setAttribute("r", 14);
  hub.setAttribute("fill", "#12203a");
  svg.appendChild(hub);
}

function drawTicks(svg, cx, cy, outerR, minorCount, majorEvery, tickLength) {
  var g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  for (var i = 0; i < minorCount; i++) {
    var isMajor = i % majorEvery === 0;
    var deg = (360 / minorCount) * i - 90;
    var rad = (deg * Math.PI) / 180;
    var len = isMajor ? tickLength * 1.6 : tickLength;
    var x1 = cx + outerR * Math.cos(rad);
    var y1 = cy + outerR * Math.sin(rad);
    var x2 = cx + (outerR - len) * Math.cos(rad);
    var y2 = cy + (outerR - len) * Math.sin(rad);
    var tick = document.createElementNS("http://www.w3.org/2000/svg", "line");
    tick.setAttribute("x1", x1); tick.setAttribute("y1", y1);
    tick.setAttribute("x2", x2); tick.setAttribute("y2", y2);
    tick.setAttribute("stroke", "#12203a");
    tick.setAttribute("stroke-width", isMajor ? 4 : 2);
    tick.setAttribute("stroke-linecap", "round");
    tick.setAttribute("opacity", isMajor ? "0.75" : "0.4");
    g.appendChild(tick);
  }
  svg.appendChild(g);
}

function drawReadout(svg, cx, cy, text, borderColor) {
  var bezel = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  bezel.setAttribute("x", cx - 70); bezel.setAttribute("y", cy - 26);
  bezel.setAttribute("width", 140); bezel.setAttribute("height", 52);
  bezel.setAttribute("rx", 10); bezel.setAttribute("fill", "#12203a");
  bezel.setAttribute("stroke", borderColor || "#12203a");
  bezel.setAttribute("stroke-width", 3);
  svg.appendChild(bezel);

  var screen = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  screen.setAttribute("x", cx - 60); screen.setAttribute("y", cy - 18);
  screen.setAttribute("width", 120); screen.setAttribute("height", 36);
  screen.setAttribute("rx", 4); screen.setAttribute("fill", "#0b1526");
  svg.appendChild(screen);

  var label = document.createElementNS("http://www.w3.org/2000/svg", "text");
  label.setAttribute("x", cx); label.setAttribute("y", cy);
  label.setAttribute("text-anchor", "middle");
  label.setAttribute("dominant-baseline", "central");
  label.setAttribute("font-size", "20");
  label.setAttribute("class", "digital");
  label.textContent = text;
  svg.appendChild(label);
}

function describeWedge(cx, cy, r, startDeg, endDeg) {
  var start = polarToCartesian(cx, cy, r, startDeg);
  var end = polarToCartesian(cx, cy, r, endDeg);
  var largeArcFlag = endDeg - startDeg <= 180 ? 0 : 1;
  return ["M", cx, cy, "L", start.x, start.y, "A", r, r, 0, largeArcFlag, 1, end.x, end.y, "Z"].join(" ");
}

function polarToCartesian(cx, cy, r, deg) {
  var rad = (deg * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
</script>
</body>
</html>
