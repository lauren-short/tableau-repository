<!DOCTYPE html>
<!--
  Configure dialog for the Car Fill viz extension.
  Opened via Marks card > "Format Extension" (registered by the
  <context-menu><configure-context-menu-item/></context-menu> entry in
  car-fill-viz.trex). Lets the user set a color and a freeform label
  template per category value, saved directly to tableau.extensions.settings.
-->
<html>
<head>
<meta charset="utf-8" />
<title>Configure Car Fill</title>
<script src="./tableau.extensions.1.latest.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 12px;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 13px;
    color: #333;
    box-sizing: border-box;
  }
  h3 {
    margin: 0 0 10px;
    font-size: 14px;
    color: #1F4E5F;
  }
  .row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid #eee;
  }
  .row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .row-top span {
    font-weight: 600;
  }
  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 4px 6px;
    font-size: 12px;
  }
  .hint {
    font-size: 11px;
    color: #888;
  }
  #btn-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  button {
    flex: 1;
    padding: 6px;
    cursor: pointer;
  }
  #save-btn {
    background: #4A90C4;
    color: #fff;
    border: none;
    border-radius: 4px;
  }
  #cancel-btn {
    background: #eee;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
</style>
</head>
<body>
<h3>Customize colors &amp; labels</h3>
<div id="rows">Loading…</div>
<div id="btn-row">
  <button id="cancel-btn">Cancel</button>
  <button id="save-btn">Save</button>
</div>

<script>
(function () {
  let categories = [];

  tableau.extensions.initializeDialogAsync().then((openPayload) => {
    try {
      categories = JSON.parse(openPayload) || [];
    } catch (e) {
      categories = [];
    }

    const rowsContainer = document.getElementById("rows");
    if (categories.length === 0) {
      rowsContainer.innerHTML = "<p>No category values found yet — add a field to the Color tile first.</p>";
    } else {
      const currentHeadlineKey = tableau.extensions.settings.get("headlineKey") || "";
      rowsContainer.innerHTML = categories.map(c => `
        <div class="row">
          <div class="row-top">
            <span>${c.label}</span>
            <input type="color" data-color-key="${c.key}" value="${c.color}">
          </div>
          <input type="text" data-label-key="${c.key}" value="${c.labelTemplate || '{name}: {value}'}">
          <div class="hint">Use {name} and {value} as placeholders</div>
          <label class="hint" style="display:flex;align-items:center;gap:4px;margin-top:2px;">
            <input type="radio" name="headline-choice" data-headline-key="${c.key}"
              ${c.key === currentHeadlineKey ? "checked" : ""}>
            Use as the main headline number
          </label>
        </div>
      `).join("");
    }

    document.getElementById("save-btn").onclick = saveAndClose;
    document.getElementById("cancel-btn").onclick = () => {
      tableau.extensions.ui.closeDialog("cancelled");
    };
  }).catch(err => {
    document.getElementById("rows").innerHTML = "Failed to load: " + err.message;
  });

  function saveAndClose() {
    const colorMapRaw = tableau.extensions.settings.get("colorMap");
    const labelMapRaw = tableau.extensions.settings.get("labelTemplates");
    const colorMap = colorMapRaw ? JSON.parse(colorMapRaw) : {};
    const labelTemplateMap = labelMapRaw ? JSON.parse(labelMapRaw) : {};

    document.querySelectorAll("input[data-color-key]").forEach(input => {
      colorMap[input.dataset.colorKey] = input.value;
    });
    document.querySelectorAll("input[data-label-key]").forEach(input => {
      labelTemplateMap[input.dataset.labelKey] = input.value;
    });

    const checkedHeadline = document.querySelector("input[name='headline-choice']:checked");
    const headlineKey = checkedHeadline ? checkedHeadline.dataset.headlineKey : "";

    tableau.extensions.settings.set("colorMap", JSON.stringify(colorMap));
    tableau.extensions.settings.set("labelTemplates", JSON.stringify(labelTemplateMap));
    tableau.extensions.settings.set("headlineKey", headlineKey);
    tableau.extensions.settings.saveAsync().then(() => {
      tableau.extensions.ui.closeDialog("saved");
    });
  }
})();
</script>
</body>
</html>
